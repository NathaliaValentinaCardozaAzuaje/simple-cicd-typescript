<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator :) </title>
</head>
<body>
  <h1>Calculator =) </h1>
  <input type="number" id="num1" placeholder="First number" />
  
  <select id="operation">
    <option value="+">+</option>
    <option value="-">−</option>
    <option value="*">×</option>
    <option value="/">÷</option>
  </select>

  <input type="number" id="num2" placeholder="Second number" />
  <button type="button" id="btnCalculate">Calculate</button>
  <p>Result: <strong id="result">—</strong></p>

  <!-- Links to compiled JS files -->
  <script src="sum.js"></script>
  <script src="substract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>
  
  <script>
    document.getElementById('btnCalculate').addEventListener('click', function () {
      var a = Number(document.getElementById('num1').value) || 0;
      var b = Number(document.getElementById('num2').value) || 0;
      var op = document.getElementById('operation').value;
      var res;

      switch (op) {
        case '+':
          res = window.sum ? window.sum(a, b) : sum(a, b);
          break;
        case '-':
          res = window.substract(a, b);
          break;
        case '*':
          res = window.multiply(a, b);
          break;
        case '/':
          res = window.divide(a, b);
          break;
      }

      document.getElementById('result').textContent = res !== null ? res : 'Error';
    });
  </script>
</body>
</html>
